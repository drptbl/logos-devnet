[package]
name = "logos-devnet"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "A local LEZ chain for Logos development: one command to start it, fund accounts and deploy programs"
license = "MIT OR Apache-2.0"
repository = "https://github.com/drptbl/logos-devnet"
readme = "README.md"
# The binary embeds docker/Dockerfile, so the package keeps it; CI config stays out.
exclude = [".github/", "action.yml"]
keywords = ["logos", "lez", "devnet", "blockchain", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "logos-devnet"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
bs58 = "0.5.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
toml = { version = "1.2.1", default-features = false, features = ["std", "serde", "parse"] }
ureq = { version = "3.5.1", default-features = false, features = ["json"] }

[dev-dependencies]
tempfile = "3.27.0"
