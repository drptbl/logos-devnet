name: image

# Builds ghcr.io/drptbl/logos-devnet-sequencer:<lez tag> for linux/amd64 and linux/arm64, each on
# a native runner (emulating a RISC Zero build takes hours), and publishes one multi-arch tag.
# Runs for the CLI's default LEZ tag when the Dockerfile changes on main, or by hand for any tag.

on:
  push:
    branches: [main]
    paths: [docker/Dockerfile, src/home.rs, .github/workflows/image.yml]
  workflow_dispatch:
    inputs:
      lez:
        description: LEZ release tag to build, e.g. v0.3.2. Empty builds the CLI's default.
        required: false

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}-${{ inputs.lez }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/drptbl/logos-devnet-sequencer

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      lez: ${{ steps.tag.outputs.lez }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: tag
        env:
          INPUT: ${{ inputs.lez }}
        run: |
          lez="$INPUT"
          if [ -z "$lez" ]; then
            lez=$(sed -n 's/^pub const DEFAULT_LEZ: &str = "\(.*\)";$/\1/p' src/home.rs)
          fi
          # Anchored, so a newline can't smuggle a second output line past the check.
          if [[ ! "$lez" =~ ^v[0-9]+(\.[0-9]+)*(-[A-Za-z0-9.]+)?$ ]]; then
            echo "not a LEZ tag: '$lez'" >&2
            exit 1
          fi
          echo "lez=$lez" >> "$GITHUB_OUTPUT"

  build:
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: LEZ_TAG=${{ needs.tag.outputs.lez }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}-${{ needs.tag.outputs.lez }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}-${{ needs.tag.outputs.lez }}
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ strategy.job-index }}
          path: digests/*
          if-no-files-found: error

  publish:
    needs: [tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the multi-arch tag
        env:
          LEZ: ${{ needs.tag.outputs.lez }}
        working-directory: digests
        run: |
          refs=()
          for digest in *; do refs+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create --tag "$IMAGE:$LEZ" "${refs[@]}"
          docker buildx imagetools inspect "$IMAGE:$LEZ"
