name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --all-targets --locked

  # The action, on a real Linux runner with Docker: the build from this commit on PATH, the
  # published image, and the project file in .github/ci.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release --locked
      - run: echo "$GITHUB_WORKSPACE/target/release" >> "$GITHUB_PATH"
      - id: devnet
        uses: ./
        with:
          config: .github/ci/logos-devnet.toml
      - name: The devnet runs and its env is exported
        env:
          SEQUENCER: ${{ steps.devnet.outputs.sequencer }}
        run: |
          set -euo pipefail
          test "$SEQUENCER" = "$LOGOS_DEVNET_SEQUENCER"
          test "$(jq '.accounts | length' "$LOGOS_DEVNET_ACCOUNTS_USERS")" = 20
          test "$RISC0_DEV_MODE" = 1
          logos-devnet --config .github/ci/logos-devnet.toml status --json \
            | jq -e '.sequencer.running and .sequencer.max_txs_per_block == 50 and .sequencer.dev_mode'
          first=$(jq -r '.accounts[0].id' "$LOGOS_DEVNET_ACCOUNTS_USERS")
          balance=$(curl -fsS "$LOGOS_DEVNET_SEQUENCER" -H 'content-type: application/json' \
            -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"getAccountBalance\",\"params\":[\"$first\"]}" \
            | jq -r .result)
          test "$balance" = 1000000
          logos-devnet fund --json "Public/$first" 5 | jq -e '.balance == 1000005'
          logos-devnet --config .github/ci/logos-devnet.toml doctor

  # The action with a session: it installs logosctl, which runners don't have, and the session
  # comes up with a funded wallet.
  action-sessions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release --locked
      - run: echo "$GITHUB_WORKSPACE/target/release" >> "$GITHUB_PATH"
      - uses: ./
        with:
          config: .github/ci/sessions.toml
      - name: logosctl is installed and the session runs
        run: |
          set -euo pipefail
          logosctl --version
          logos-devnet --config .github/ci/sessions.toml session ls --json \
            | jq -e '.[0].name == "alice" and .[0].running and .[0].balance > 0'
      - name: the messaging hub runs and its addresses are exported
        run: |
          set -euo pipefail
          logos-devnet --config .github/ci/sessions.toml status --json \
            | jq -e '.messaging.running and (.messaging.delivery | test("^/ip4/127\\.0\\.0\\.1/tcp/[0-9]+/p2p/"))'
          jq -e --arg entry "$LOGOS_DEVNET_DELIVERY_ENTRY_NODE" \
            '.mode == "Edge" and .messagingOverrides["entry-node"] == [$entry]' \
            <<< "$LOGOS_DEVNET_DELIVERY_CONFIG"
          [[ "$LOGOS_DEVNET_DISCOVERY_BOOTSTRAP" == /ip4/127.0.0.1/tcp/*/p2p/* ]]
      - name: a file one session uploads, another downloads through the hub
        run: |
          set -euo pipefail
          config=.github/ci/sessions.toml
          call() { logosctl --json call storage_module "$@" | tail -1 | jq -c .result; }
          logos-devnet --config $config status --json | jq -e '.storage.running'
          source <(logos-devnet --config $config session env alice)
          logosctl --json watch storage_module > alice.log &
          watch=$!
          sleep 2
          echo "from alice $GITHUB_RUN_ID" > input.txt
          call uploadUrl "str:$PWD/input.txt" 65536 true
          for _ in $(seq 30); do grep -q storageUploadDone alice.log && break; sleep 1; done
          cid=$(grep storageUploadDone alice.log | tail -1 | jq -r '.data.arg0 | fromjson | .cid')
          source <(logos-devnet --config $config session env bob)
          call downloadToUrl "str:$cid" "str:$PWD/output.txt" false 65536 false true
          for _ in $(seq 30); do [ -s output.txt ] && break; sleep 1; done
          kill $watch
          diff input.txt output.txt
      # The container runs a few seconds before its sequencer answers, as after an `up` that
      # was stopped while a long chain loaded: the next `up` waits for it.
      - name: up waits for a sequencer that's still starting
        run: |
          set -euo pipefail
          logos-devnet --config .github/ci/sessions.toml down
          docker compose --file ~/.logos-devnet/compose.yaml up --detach sequencer
          logos-devnet --config .github/ci/sessions.toml up --json \
            | jq -e '.sequencer.running and .sequencer.block > 0'
          logos-devnet --config .github/ci/sessions.toml session ls --json \
            | jq -e '.[0].running'

  # The action's install path, against a published release.
  action-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          version: v0.1.0
          start: "false"
      - run: logos-devnet --version | grep -q '^logos-devnet 0.1.0$'

  # The install path on macOS, which only installs: there's no Docker to start the devnet.
  action-install-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          version: v0.3.0
          start: "false"
      - run: logos-devnet --version | grep -q '^logos-devnet 0.3.0$'

