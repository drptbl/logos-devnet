name: logos-devnet
description: Start a local LEZ devnet for integration tests, set up from the project's logos-devnet.toml.
branding:
  icon: box
  color: blue

inputs:
  version:
    description: >-
      The logos-devnet release to install, as its tag. Empty installs the release this action
      was used at (`uses: drptbl/logos-devnet@<tag>`), or uses a logos-devnet already on PATH,
      or, pinned to a commit, installs the release that commit's Cargo.toml names.
    required: false
    default: ""
  config:
    description: The project file. Empty finds logos-devnet.toml from working-directory up.
    required: false
    default: ""
  working-directory:
    description: Where to run logos-devnet.
    required: false
    default: "."
  args:
    description: >-
      More options for `logos-devnet up`, e.g. `--max-txs-per-block 100`. Set the home with the
      LOGOS_DEVNET_HOME env var, not `--home`.
    required: false
    default: ""
  start:
    description: Start the devnet. "false" only installs logos-devnet, which works on macOS too.
    required: false
    default: "true"
  logosctl-version:
    description: >-
      The Logos Core CLI (logosctl) release to install when the project's sessions need it and
      none is on PATH.
    required: false
    default: "0.3.2"

outputs:
  sequencer:
    description: The devnet's RPC URL.
    value: ${{ steps.up.outputs.sequencer }}

runs:
  using: composite
  steps:
    - name: Install logos-devnet
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
        START: ${{ inputs.start }}
      run: |
        set -euo pipefail
        # GitHub compares `start` without case, in the step that starts the devnet.
        start=$(printf '%s' "$START" | tr '[:upper:]' '[:lower:]')
        if [ "$RUNNER_OS" != "Linux" ] && [ "$start" = "true" ]; then
          echo "::error::the devnet runs on Linux runners: it needs Docker. start: \"false\" only installs logos-devnet"
          exit 1
        fi
        v="$VERSION"
        if [ -z "$v" ] && [[ "$ACTION_REF" =~ ^v[0-9] ]]; then
          v="$ACTION_REF"
        fi
        # The release the action's own Cargo.toml names, read only when it's needed.
        own() {
          echo "v$(sed -n 's/^version = "\(.*\)"$/\1/p' "$GITHUB_ACTION_PATH/Cargo.toml" | head -1)"
        }
        # Pinned to a commit: that commit's release, before anything on PATH, which may be
        # another version.
        if [ -z "$v" ] && [[ "$ACTION_REF" =~ ^[0-9a-f]{40}$ ]]; then
          v="$(own)"
        fi
        if [ -z "$v" ] && command -v logos-devnet >/dev/null; then
          echo "Using $(command -v logos-devnet): $(logos-devnet --version)"
          exit 0
        fi
        # A branch, or a local copy of the action.
        if [ -z "$v" ]; then
          v="$(own)"
        fi
        if [[ ! "$v" =~ ^v[0-9]+(\.[0-9]+)*(-[A-Za-z0-9.]+)?$ ]]; then
          echo "::error::not a logos-devnet version: $v"
          exit 1
        fi
        case "$RUNNER_OS-$(uname -m)" in
          Linux-x86_64) target=x86_64-unknown-linux-musl ;;
          Linux-aarch64 | Linux-arm64) target=aarch64-unknown-linux-musl ;;
          macOS-x86_64) target=x86_64-apple-darwin ;;
          macOS-arm64) target=aarch64-apple-darwin ;;
          *) echo "::error::no logos-devnet build for $RUNNER_OS on $(uname -m)"; exit 1 ;;
        esac
        name="logos-devnet-$v-$target"
        dir="$RUNNER_TEMP/logos-devnet"
        mkdir -p "$dir"
        cd "$dir"
        url="https://github.com/drptbl/logos-devnet/releases/download/$v/$name.tar.gz"
        if ! curl -fsSL --retry 3 -o "$name.tar.gz" "$url"; then
          echo "::error::no logos-devnet $v release for $target. Set the version input to a published release"
          exit 1
        fi
        curl -fsSL --retry 3 -o "$name.tar.gz.sha256" "$url.sha256"
        if command -v sha256sum >/dev/null; then
          sha256sum -c "$name.tar.gz.sha256"
        else
          shasum -a 256 -c "$name.tar.gz.sha256"
        fi
        tar -xzf "$name.tar.gz"
        echo "$dir/$name" >> "$GITHUB_PATH"
        "$dir/$name/logos-devnet" --version

    - name: Install logosctl for sessions
      if: inputs.start == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CONFIG: ${{ inputs.config }}
        VERSION: ${{ inputs.logosctl-version }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        config=()
        if [ -n "$CONFIG" ]; then
          config=(--config "$CONFIG")
        fi
        # doctor checks logosctl only when sessions need it, so a failed check is the cue.
        checks=$(logos-devnet "${config[@]}" doctor --json || true)
        if ! jq -e '.checks[] | select(.name == "logosctl" and (.ok | not))' <<< "$checks" >/dev/null; then
          exit 0
        fi
        if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+)*(-[A-Za-z0-9.]+)?$ ]]; then
          echo "::error::not a logosctl version: $VERSION"
          exit 1
        fi
        case "$(uname -m)" in
          x86_64) arch=x86_64 ;;
          aarch64 | arm64) arch=aarch64 ;;
          *) echo "::error::no logosctl build for $(uname -m)"; exit 1 ;;
        esac
        name="logosctl-$arch-linux.tar.gz"
        # The default release's digests are pinned here; others come from GitHub's release.
        case "$VERSION-$arch" in
          0.3.2-x86_64) sha=294fbcc6409a8851b7471582bdad2dbfaf681b5d1c67dfffec38ada925dc6762 ;;
          0.3.2-aarch64) sha=e77ccd9c1a7e673c1a5533f2bcda03f84fd04e80f415ac414c378a897e5135fe ;;
          *)
            sha=$(gh api "repos/logos-co/logos-logoscore-cli/releases/tags/$VERSION" \
              --jq ".assets[] | select(.name == \"$name\") | .digest" | sed 's/^sha256://')
            ;;
        esac
        if [ -z "$sha" ]; then
          echo "::error::logosctl $VERSION has no $name"
          exit 1
        fi
        dir="$RUNNER_TEMP/logosctl"
        mkdir -p "$dir/bin"
        cd "$dir"
        curl -fsSL --retry 3 -o "$name" \
          "https://github.com/logos-co/logos-logoscore-cli/releases/download/$VERSION/$name"
        echo "$sha  $name" | sha256sum -c
        tar -xzf "$name"
        # An AppImage, and runners have no FUSE: run it extracted.
        appimage=$(find . -maxdepth 2 -name '*.AppImage' | head -1)
        chmod +x "$appimage"
        "$appimage" --appimage-extract > /dev/null
        printf '#!/bin/sh\nexec "%s/squashfs-root/AppRun" "$@"\n' "$dir" > bin/logosctl
        chmod +x bin/logosctl
        echo "$dir/bin" >> "$GITHUB_PATH"
        bin/logosctl --version

    - id: up
      name: Start the devnet
      if: inputs.start == 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CONFIG: ${{ inputs.config }}
        ARGS: ${{ inputs.args }}
      run: |
        set -euo pipefail
        config=()
        if [ -n "$CONFIG" ]; then
          config=(--config "$CONFIG")
        fi
        # Space-separated options, without shell quoting.
        read -r -a args <<< "$ARGS"
        # `env` below has to read the home `up` starts, so neither may get its own.
        for arg in "${args[@]}"; do
          case "$arg" in
            --home | --home=* | --config | --config=*)
              echo "::error::set the home with LOGOS_DEVNET_HOME and the project file with the config input, not with args"
              exit 1
              ;;
          esac
        done
        logos-devnet "${config[@]}" up "${args[@]}"
        env_json=$(logos-devnet "${config[@]}" env --json)
        # A value with a newline could add variables of its own to the job.
        if ! jq -e 'all(.[]; contains("\n") | not)' <<< "$env_json" >/dev/null; then
          echo "::error::a devnet env value holds a newline; use paths without one"
          exit 1
        fi
        jq -r 'to_entries[] | "\(.key)=\(.value)"' <<< "$env_json" >> "$GITHUB_ENV"
        sequencer=$(jq -r .LOGOS_DEVNET_SEQUENCER <<< "$env_json")
        echo "sequencer=$sequencer" >> "$GITHUB_OUTPUT"

    - name: Print the devnet's logs
      if: failure() && steps.up.conclusion == 'failure'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        CONFIG: ${{ inputs.config }}
      run: |
        config=()
        if [ -n "$CONFIG" ]; then
          config=(--config "$CONFIG")
        fi
        echo "::group::sequencer"
        logos-devnet "${config[@]}" logs || true
        echo "::endgroup::"
        # A session or the hub can fail while the sequencer runs fine.
        sessions=$(logos-devnet "${config[@]}" session ls --json 2>/dev/null | jq -r '.[].name' || true)
        for session in $sessions; do
          echo "::group::session $session"
          logos-devnet "${config[@]}" logs --session "$session" || true
          echo "::endgroup::"
        done
        hub_log="$RUNNER_TEMP/logos-devnet-hub.log"
        if logos-devnet "${config[@]}" logs --hub > "$hub_log" 2>&1; then
          echo "::group::hub"
          cat "$hub_log"
          echo "::endgroup::"
        fi
